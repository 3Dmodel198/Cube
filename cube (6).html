  if (!timeLocked) dayT = (dayT + dt / DAY_LEN) % 1;
  if (isHost && conns.length && now - lastTime > 4000) { lastTime = now; broadcast({ type: 'time', t: dayT, lock: timeLocked }); }
  crouchOff += ((isCrouch() ? .3 : 0) - crouchOff) * lk;
  applyTime(); flushInst();
  camera.position.y -= crouchOff; renderer.render(scene, camera); camera.position.y += crouchOff;
}
animate();
const onResize = () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); };
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 200));
document.addEventListener('fullscreenchange', () => setTimeout(onResize, 100));
</script>
